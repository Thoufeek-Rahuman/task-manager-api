[project]
name = "task-manager-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.20.1",
    "fastapi[standard]>=0.162.0",
    "psycopg2>=2.9.13",
    "pydantic-settings>=2.16.2",
    "sqlalchemy>=2.1.8",
]
[tool.fastapi]
entrypoint = "app.main:app"
[tool.pyright]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
